# 最小 CI：只跑仓库内的**合成、离线**测试与静态检查。
# - 不上传任何聊天数据/密钥/数据库：仓库里没有它们，测试只用临时目录里的合成夹具。
# - 唯一的网络是 runner 自己按 uv.lock 装依赖；本项目的运行时代码在测试里没有外联。
# - 本文件在本机**未在 GitHub Actions 上实际执行过**（本阶段不允许 push），审计里记为 PARTIAL。
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: git config core.hooksPath security/hooks
      - run: scripts/check.sh
