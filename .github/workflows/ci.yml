# 最小 CI：只跑仓库内的**合成、离线**测试与静态检查。
# - 不上传任何聊天数据/密钥/数据库：仓库里没有它们，测试只用临时目录里的合成夹具。
# - 唯一的网络是 runner 自己按 uv.lock 装依赖 + `brew install sqlcipher`；运行时代码没有外联。
# - 三个 runner 侧前提（2026-10-29 首跑 + 2026-11-01 镜像退役时暴露）：
#   ① `sqlcipher` CLI：解密链路的集成测试要真的调它；
#   ② 解释器必须支持 `enable_load_extension`——系统自带的 Python 3.12 不支持，
#      所以钉成 uv 管理的 CPython（`UV_PYTHON_PREFERENCE=only-managed`）。
#   ③ runner 镜像：**macOS 14 于 2026-11-02 退役**，退役前的 brownout 会让 job 直接被
#      取消（2026-11-01 实测：1 秒结束、注解写明 brownout）。故钉 `macos-15`。
#      不写 `macos-latest`：那会在下次大版本切换时**静默**跳变，而本项目的测试真的调
#      `sqlcipher`，且会碰 `tmutil` / lldb 的**桩与红线**——环境跳变应当是一次有意识的改动。
name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UV_PYTHON_PREFERENCE: only-managed
  HOMEBREW_NO_AUTO_UPDATE: "1"
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: brew install sqlcipher
      - run: uv sync --frozen --all-extras    # 含可选的 [semantic]：类型检查与向量用例要 fastembed
      - run: git config core.hooksPath security/hooks
      # `runner` 上下文在 jobs.<id>.env 不可用——写在那层会让整份工作流被判为无效
      # （0 s 失败、无 job）。放 step 级才生效。
      - run: scripts/check.sh
        env:
          AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home
      # 回退路径（sqlcipher CLI 整库导出）平时没人走，最容易坏而没人发现：同一套用例再跑一遍
      - run: uv run --frozen python -m pytest tests -q
        env:
          AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home-cli
          AGENT_WECHAT_DECRYPT: cli
  # 基础安装（不带 `[semantic]`）：没有 fastembed 时检索降级成关键词、`doctor` 报「未装」——
  # 这条路径此前只在本地验证过。只跑用例：pyright / vulture 要看到 fastembed 的类型，留在 gate。
  base-install:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: brew install sqlcipher
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python -c "import importlib.util as u, sys; sys.exit(u.find_spec('fastembed') is not None)"
      - run: uv run --frozen --no-sync python -m pytest tests -q
        env:
          AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home-base
