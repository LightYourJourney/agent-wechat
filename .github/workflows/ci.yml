# 最小 CI：只跑仓库内的**合成、离线**测试与静态检查。
# - 不上传任何聊天数据/密钥/数据库：仓库里没有它们，测试只用临时目录里的合成夹具。
# - 唯一的网络是 runner 自己按 uv.lock 装依赖 + `brew install sqlcipher`；运行时代码没有外联。
# - 两个 runner 侧前提（2026-10-29 首跑才暴露）：
#   ① `sqlcipher` CLI：解密链路的集成测试要真的调它；
#   ② 解释器必须支持 `enable_load_extension`——系统自带的 Python 3.12 不支持，
#      所以钉成 uv 管理的 CPython（`UV_PYTHON_PREFERENCE=only-managed`）。
#   ③ runner 镜像：**macOS 14 于 2026-11-02 退役**，退役前的 brownout 会让 job 直接被
#      取消（2026-11-01 实测：1 秒结束、注解写明 brownout）。故钉 `macos-15`。
#      不写 `macos-latest`：那会在下次大版本切换时**静默**跳变，而本项目的测试真的调
#      `sqlcipher` / `tmutil` / lldb——环境跳变应当是一次有意识的改动。
name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: brew install sqlcipher
      - run: uv sync --frozen
      - run: git config core.hooksPath security/hooks
      # `runner` 上下文在 jobs.<id>.env 不可用——写在那层会让整份工作流被判为无效
      # （0 s 失败、无 job）。放 step 级才生效。
      - run: scripts/check.sh
        env:
          AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home
