# 最小 CI：只跑仓库内的**合成、离线**测试与静态检查。
# - 不上传任何聊天数据/密钥/数据库：仓库里没有它们，测试只用临时目录里的合成夹具。
# - 唯一的网络是 runner 自己按 uv.lock 装依赖；本项目的运行时代码在测试里没有外联。
# - 本机只验证过它调用的 scripts/check.sh；工作流本身要到公开仓首次 push 后才真正跑起来。
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: git config core.hooksPath security/hooks
      # `runner` 上下文在 jobs.<id>.env 不可用——写在那层会让整份工作流被判为无效
      # （0 s 失败、无 job）。放 step 级才生效。
      - run: scripts/check.sh
        env:
          AGENT_WECHAT_HOME: ${{ runner.temp }}/aw-home
