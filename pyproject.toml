[project]
name = "agent-wechat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yanjin Li", email = "yanjinli502@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "zstandard>=0.25.0",
]

[project.scripts]
agent-wechat = "agent_wechat:main"
agent-wechat-mcp = "agent_wechat.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wechat"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
