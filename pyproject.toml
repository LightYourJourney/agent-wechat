[project]
name = "agent-wechat"
version = "0.2.0rc1"
description = "读取本机已登录微信账号的聊天记录，供 Claude Code / Codex 等 Agent 调用的本地 MCP 服务器"
license = { text = "GPL-3.0-only" }
readme = "README.md"
authors = [
    { name = "Yanjin Li", email = "yanjinli502@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "zstandard>=0.25.0",
    "fastembed==0.8.*",
    "sqlite-vec==0.1.9",
    "cryptography>=50.0.1",
    "pilk>=0.2.4",
]

[project.scripts]
agent-wechat = "agent_wechat:main"
agent-wechat-mcp = "agent_wechat.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wechat"]

# 默认（不给 include/exclude）hatchling 按 VCS 跟踪面把整棵工作树打进 sdist——
# 实测 55 个条目，含 docs/(13) tests/(14) skills/ spike/。sdist 只保留装包与运行
# 必需的最小面。README.md 必须在列：构建 wheel 时构建后端要读它生成 PKG-INFO。
[tool.hatch.build.targets.sdist]
include = [
    "src/agent_wechat",
    "pyproject.toml",
    "/README.md",
]
# `.gitignore` 无论如何都会进 sdist——hatchling 的 sdist builder 强制包含它，
# 实测 `exclude` / `only-include` / `ignore-vcs` 三种写法都排除不掉（2026-10-30）。
# 它只含目录名（.venv/、.claude/ 之类），不含任何标识，故接受。

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "vulture>=2.16",
    # 优化循环的探针要算圈复杂度（spec §4.1 的 complexity 块）。
    # 只作 dev 依赖——**运行时依赖的增量为 0** 是 spec §5 的硬上限。
    "radon>=6.0.1",
    "hypothesis>=6.170.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: 需要真实 fastembed 模型（默认不跑；用 -m slow 运行）",
    "real: 需要本机真实数据/模型（默认不跑；用 -m real 运行）",
]
# `real` 也排除：它此前只靠「每个 real 测试都同时标了 slow」被连带 deselect，
# 新增一条只标 real 的用例就会在默认门禁里真读本机数据 / 发 CDN 请求（Phase 00 R-00-4）。
addopts = "-m 'not slow and not real'"
